# Workflow GitHub Actions: build Astro + deploy su GitHub Pages
# Si attiva automaticamente a ogni push sul ramo main.
# Node gira sui runner di GitHub (gratis su repo pubblico) — non serve installarlo localmente.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permessi: GitHub Pages richiede 'pages: write' e 'id-token: write'
permissions:
  contents: read
  pages: write
  id-token: write

# Una sola deployment alla volta
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build del sito
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Python non serve installarlo (è preinstallato su ubuntu-latest);
      # serve solo Pillow per ottimizzare le immagini WebP.
      - name: Install Pillow (for portfolio generator)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pillow

      # Genera (o rigenera in modo idempotente) card e pagine-progetto dalle
      # cartelle immagini in assets/portfolio/. Se le origini non sono presenti
      # (checkout CI: la cartella è gitignorata) lo script esce senza toccare i
      # .md già versionati, quindi il build resta valido.
      - name: Generate portfolio (auto)
        run: python3 scripts/generate_portfolio.py

      - name: Build site
        run: npm run build

      # Le immagini statiche vanno copiate nel build. Che siano grosse o piccole,
      # Astro le serve da public/ senza elaborazione. Verifichiamo solo che dist/ esista.
      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # Deploy su GitHub Pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
